name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */24 * * *"  # Runs every 24 hours
  workflow_dispatch:         # Manual trigger option
  push:
    branches:
      - main                # Changed from master to main (GitHub's default)

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: clarissagncvs  # Explicitly using your username
          outputs: |
            assets/github-contribution-snake.svg
            assets/github-contribution-snake-dark.svg?palette=github-dark

      - name: Commit and Push
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: main  # Pushing to main branch instead of 'output'
          build_dir: assets    # Changed to more standard assets folder
          keep_history: true   # Preserves commit history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
